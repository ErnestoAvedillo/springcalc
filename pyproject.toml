[project]
name = "springcalc"
version = "0.1.25"
description = "Spring calculation library: compression, extension, and torsion."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ernesto Avedillo", email = "eavedillo@yahoo.es" },
]
keywords = ["muelles", "resortes", "springs", "shigley", "goodman", "fatiga", "ingeniería"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "pint>=0.24",
    "pydantic>=2.13.4",
    "reportlab>=4.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
# Only needed to run scripts/regresiones/*, which regenerate the plain-number
# JSON coefficients shipped in the package. Not required at runtime.
training = [
    "scikit-learn>=1.5",
]
step = [
    "cadquery>=2.8.0",
]

# Development-only tools (tests, linting, packaging). uv installs the "dev"
# group automatically for `uv run`/`uv sync`; it is never installed for
# users who `pip install springcalc`.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "flake8>=7.0",
    "flake8-pyproject>=1.2",
    "mypy>=2.3.1",
    "build>=1.5.0",
    "twine>=7.0.0",
    "pypistats>=1.14.0",
]

[project.urls]
Homepage = "https://github.com/ErnestoAvedillo/springcalc"
Repository = "https://github.com/ErnestoAvedillo/springcalc"
Issues = "https://github.com/ErnestoAvedillo/springcalc/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# JSON files are matched by the repo-wide *.json rule in .gitignore, so the
# coefficients file must be force-included even though it is tracked in git.
# This is set for every target (not just the wheel): `python -m build` builds
# the wheel *from the sdist*, so a file missing from the sdist is also
# missing from the wheel (that is how 0.1.25 shipped without it).
artifacts = ["src/springcalc/regresiones/factor_f/factor_f_coeffs.json"]

[tool.hatch.build.targets.wheel]
# src-layout: the importable package lives at src/springcalc.
# CSV material tables are bundled automatically.
packages = ["src/springcalc"]

[tool.hatch.build.targets.sdist]
exclude = [
    "src/tmp",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.flake8]
max-line-length = 150
